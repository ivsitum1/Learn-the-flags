<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ljetni park — ponavljanje 1. razreda</title>
  <meta name="description" content="Zabavno ljetno ponavljanje gradiva prvog razreda: matematika, hrvatski jezik, priroda i društvo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fontovi se učitavaju bez blokiranja prikaza: dok ne stignu (ili ako
       nema mreže), tekst se ispisuje sistemskim fontom iz --font-body.
       Prije je spor pristup Google Fontsu držao ekran praznim po desetak
       sekundi — na tabletu je izgledalo kao da se aplikacija ne otvara. -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" />
  </noscript>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>" />

  <!-- PWA: instalacija na početni zaslon tableta -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#3d8ec9" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ljetni park" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sky-sun"></div>
    <div class="sky-cloud sky-cloud--1"></div>
    <div class="sky-cloud sky-cloud--2"></div>
    <div class="sky-cloud sky-cloud--3"></div>
    <div class="sky-sparks">
      <span class="sky-spark"></span>
      <span class="sky-spark"></span>
      <span class="sky-spark"></span>
      <span class="sky-spark"></span>
      <span class="sky-spark"></span>
      <span class="sky-spark"></span>
    </div>
    <div class="sky-ground"></div>
  </div>

  <header class="topbar">
    <button type="button" class="back-btn hidden" id="btnBack" aria-label="Natrag">←</button>
    <div class="brand-mini" id="brandMini">
      <span class="brand-sun">☀️</span>
      <span>Ljetni park</span>
    </div>
    <button type="button" class="stars-total" id="starsTotal"
      title="Novčanik — otvori dućan"
      aria-label="Novčanik — otvori dućan">🎒 Novčanik ⭐ 0</button>
  </header>

  <main>
    <!-- HUB -->
    <section class="view active" id="view-hub" data-view="hub">
      <div class="hero">
        <p class="hero-kicker">Ljetni park · 1. razred</p>
        <h1 class="hero-title">Potraga za blagom</h1>
        <p class="hero-sub">Prati staze kroz tri regije otoka — svaka stanica otključava sljedeći trag.</p>
      </div>
      <div class="island-scene gusar-locked" id="islandScene" aria-hidden="true">
        <svg class="island-svg" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <defs>
            <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7ec8f5"/>
              <stop offset="100%" stop-color="#3d8ec9"/>
            </linearGradient>
          </defs>
          <rect width="360" height="220" fill="url(#seaGrad)" rx="18"/>
          <!-- main island -->
          <ellipse cx="175" cy="130" rx="130" ry="58" fill="#6fbf73"/>
          <ellipse cx="175" cy="118" rx="118" ry="48" fill="#8fd18a"/>
          <!-- mat zone -->
          <g class="island-zone island-zone--mat">
            <ellipse cx="110" cy="115" rx="38" ry="28" fill="#2f8f6b"/>
            <text x="110" y="120" text-anchor="middle" font-size="22">🔢</text>
          </g>
          <!-- hrv zone -->
          <g class="island-zone island-zone--hrv">
            <ellipse cx="175" cy="95" rx="36" ry="26" fill="#d97706"/>
            <text x="175" y="100" text-anchor="middle" font-size="22">📖</text>
          </g>
          <!-- pid zone -->
          <g class="island-zone island-zone--pid">
            <ellipse cx="240" cy="120" rx="38" ry="28" fill="#2563a8"/>
            <text x="240" y="125" text-anchor="middle" font-size="22">🌿</text>
          </g>
          <!-- paths -->
          <path class="island-path" d="M140 115 Q175 105 210 118" fill="none" stroke="#ffc93c" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
          <path class="island-path" d="M175 118 Q200 140 230 130" fill="none" stroke="#ffc93c" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
          <!-- bridge / mist to gusar -->
          <path class="island-bridge" d="M285 145 Q310 150 325 155" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4" stroke-dasharray="4 6"/>
          <!-- gusar islet -->
          <g class="island-zone island-zone--gus">
            <ellipse cx="325" cy="165" rx="28" ry="18" fill="#1e3a4c"/>
            <text class="gus-flag" x="325" y="168" text-anchor="middle" font-size="18">🏴‍☠️</text>
            <text class="gus-lock" x="325" y="170" text-anchor="middle" font-size="16">🔒</text>
          </g>
        </svg>
      </div>
      <div class="subject-grid" id="subjectGrid"></div>
    </section>

    <!-- SHOP -->
    <section class="view" id="view-shop" data-view="shop">
      <div class="shop-head">
        <h2>Dućan nagrada</h2>
        <p class="shop-blurb">Potroši zvjezdice na stvarne nagrade — roditelj ih obavi.</p>
      </div>
      <div class="shop-grid" id="shopGrid"></div>
      <div class="shop-history">
        <h3>Nedavno iskorišteno</h3>
        <ul id="shopHistory"></ul>
      </div>
    </section>

    <!-- SUBJECT -->
    <section class="view" id="view-subject" data-view="subject">
      <div class="subject-head">
        <span class="subject-icon" id="subjectIcon"></span>
        <div>
          <h2 id="subjectTitle"></h2>
          <p id="subjectBlurb" class="subject-blurb"></p>
        </div>
      </div>
      <div class="game-grid" id="gameGrid"></div>
    </section>

    <!-- GAME INTRO -->
    <section class="view" id="view-intro" data-view="intro">
      <div class="panel intro-panel">
        <span class="intro-emoji" id="introEmoji"></span>
        <h2 id="introTitle"></h2>
        <p id="introDesc" class="intro-desc"></p>
        <p class="intro-meta"><span id="introCount"></span> zadataka · do 3 ⭐</p>
        <button type="button" class="btn primary big" id="btnStart">Kreni!</button>
      </div>
    </section>

    <!-- PLAY -->
    <section class="view" id="view-play" data-view="play">
      <div class="play-bar">
        <div class="progress-track"><span id="playProgress"></span></div>
        <div class="play-stats">
          <span id="playCounter">1 / 10</span>
          <span class="play-score">Točno: <strong id="playCorrect">0</strong></span>
        </div>
      </div>
      <div class="panel play-panel" id="playPanel"></div>
      <div class="feedback hidden" id="feedback"></div>
      <div class="play-actions" id="playActions"></div>
    </section>

    <!-- RESULT -->
    <section class="view" id="view-result" data-view="result">
      <div class="panel result-panel">
        <div class="result-stars" id="resultStars"></div>
        <h2 id="resultTitle">Bravo!</h2>
        <p id="resultMsg" class="result-msg"></p>
        <p class="result-score"><span id="resultScore"></span></p>
        <div class="result-actions">
          <button type="button" class="btn primary" id="btnReplay">Igraj ponovno</button>
          <button type="button" class="btn ghost" id="btnToSubject">Natrag na predmet</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/progress.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/content/matematika.js"></script>
  <!-- Mora doći prije hrvatski.js — ondje se te stanice dodaju na stazu. -->
  <script src="js/content/nina-tino-hrvatski.js"></script>
  <script src="js/content/hrvatski.js"></script>
  <script src="js/content/priroda.js"></script>
  <script src="js/content/gusarski.js"></script>
  <script src="js/app.js"></script>
  <!-- Skočni gumb „Osvježi“ kad je objavljena nova verzija (dijeli se s glavnom aplikacijom). -->
  <script src="../js/update-notice.js"></script>
</body>
</html>
