name: Deploy to GitHub Pages

# Objavljuje statičnu aplikaciju na GitHub Pages.
# Jednokratno u repo postavkama: Settings → Pages → Source = GitHub Actions
# (GITHUB_TOKEN ne smije sam kreirati Pages site — zato nema enablement: true.)
on:
  push:
    branches:
      - main
      - master
      - claude/flags-learning-app-plan-tpos3s
      - feat/ljeto-1razred
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html LICENSE README.md DATA_VERIFICATION.md _site/
          cp -r css js _site/
          if [ -d ljeto-1razred ]; then
            cp -r ljeto-1razred _site/
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
