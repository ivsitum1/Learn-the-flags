name: Deploy to GitHub Pages

# Objavljuje statičnu aplikaciju na GitHub Pages.
# Jednokratno u repo postavkama: Settings → Pages → Source = GitHub Actions
# (GITHUB_TOKEN ne smije sam kreirati Pages site — zato nema enablement: true.)
#
# NAPOMENA: objavljuje se samo s radne grane. Grana „main" NIJE ovdje jer
# okruženje „github-pages" još ne dopušta objavu s nje (svaka bi objava odmah
# pala i slala e-mail). Kad se main postavi kao zadana grana i dopusti u
# Settings → Environments → github-pages, tada ga dodaj natrag u okidače.
on:
  push:
    branches:
      - claude/flags-learning-app-plan-tpos3s
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html LICENSE README.md DATA_VERIFICATION.md manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          if [ -d ljeto-1razred ]; then
            cp -r ljeto-1razred _site/
          fi
          # Oznaka verzije za skočni gumb „Osvježi“ (js/update-notice.js).
          # Otvorene kartice ju povremeno provjere i ponude osvježavanje.
          printf '{\n  "version": "%s",\n  "builtAt": "%s"\n}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
